# One disposable candidate; no host home/cache/socket mounts.
minimumLimaVersion: 2.3.0
vmType: vz
arch: aarch64
cpus: 4
memory: 6GiB
disk: 24GiB
images:
  - location: https://cloud-images.ubuntu.com/releases/resolute/release-20261016/ubuntu-26.04-server-cloudimg-arm64.img
    arch: aarch64
    digest: sha256:8eb876c2ccc4b6ff89e4a65d511815923b285e04503ba465809bf587f763da24
mounts: []
ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false
  forwardX11: false
containerd:
  system: true
  user: false
portForwards:
  - guestIP: 0.0.0.0
    proto: any
    ignore: true
networkOpts:
  hostLoopback: false
propagateProxyEnv: false
param:
  internal_netplanOptional: 'true'
